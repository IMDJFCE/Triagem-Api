<body class="container">
  <img src="assets/logo.svg" alt="Logo" class="logo">
  <h1 class="text">Plataforma de Gestão de Oportunidades e Talentos da 5ª Região</h1>
  <div class="form-center">
    <form [formGroup]="form">
      <h3 class="text">Faça seu cadastro simplificado</h3>
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput type="text" formControlName="nome">
        <mat-icon matSuffix>contacts</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email">
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Matrícula</mat-label>
        <input matInput type="text" formControlName="matricula">
        <mat-icon matSuffix>pin</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data de Nascimento</mat-label>
        <input matInput type="date" formControlName="data">
        <mat-icon matSuffix>event</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
      <button type="submit" class="button" [disabled]="form.invalid" (click)="cadastrar()">Cadastrar</button>
    </form>
  </div>
</body>
